# Groups — what belongs together on this design (update 30).
# Written once by Vel on 2026-10-17; edit freely, Vel never rewrites this file.
# "reset the groups" starts over.
# owner: the teammate (email, name or user id) who accepts this group's numbers.
# A row named _goals says who owns the goals; with none, whoever stated the first goal.
# Any other row with no owner: whoever is working decides.
